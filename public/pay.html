<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay — Uncle Store</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main>
  <div class="card" style="max-width:420px;margin:24px auto;text-align:center">
    <h2 id="desc"></h2>
    <div class="stat" id="amount"></div>
    <div id="payBox">
      <p>Pay to <strong id="payee"></strong></p>
      <p class="muted" id="howTo">Scan with any UPI app (PhonePe, GPay, Paytm) and pay exactly this amount.</p>
      <div id="qrBox" style="display:flex;justify-content:center;background:#fff;padding:12px;border-radius:12px;margin:0 auto;max-width:300px"></div>
      <p class="muted" id="upiLine"></p>
      <a id="upiApp" class="hidden"><button class="block secondary">Open my UPI app</button></a>
      <label style="text-align:left">After paying, enter the UPI reference / UTR number from your app</label>
      <input id="utr" placeholder="e.g. 412345678901" autocomplete="off">
      <button class="block" id="payBtn" style="margin-top:8px" onclick="claim()">I've paid</button>
    </div>
    <p class="muted" id="status"></p>
    <p><a id="back" href="/">← Back</a></p>
  </div>
</main>
<script src="/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const pid = params.get('id');
const back = params.get('back') || '/';
$('back').href = back.startsWith('/') ? back : '/';

async function load() {
  const p = await api('/api/payments/' + encodeURIComponent(pid));
  $('desc').textContent = p.description;
  $('amount').textContent = rupees(p.amount);
  renderPayee(p);
  $('payBox').classList.toggle('hidden', p.status !== 'pending');
  $('status').textContent = {
    paid: 'Paid ✓',
    claimed: p.kind === 'plan' ? 'Thanks! Your plan is active. We will verify the UTR.' : 'Thanks! The shop will confirm once the money reaches them.',
    pending: '',
  }[p.status];
}

// With a UPI ID we build the QR ourselves, amount included; otherwise show the uploaded QR image.
function renderPayee(p) {
  const pe = p.payee;
  $('payee').textContent = pe.name;
  $('qrBox').innerHTML = '';
  if (pe.upiId) {
    const link = `upi://pay?pa=${encodeURIComponent(pe.upiId)}&pn=${encodeURIComponent(pe.name)}&am=${p.amount.toFixed(2)}&cu=INR&tn=${encodeURIComponent(p.description.slice(0, 40))}`;
    new QRCode($('qrBox'), { text: link, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
    $('upiLine').textContent = `UPI ID: ${pe.upiId} · amount ${rupees(p.amount)} is filled in`;
    $('upiApp').href = link;
    $('upiApp').classList.toggle('hidden', !/Android|iPhone|iPad/i.test(navigator.userAgent));
  } else if (pe.qrImage) {
    $('qrBox').innerHTML = `<img src="${pe.qrImage}" alt="UPI QR code" style="width:100%;border-radius:8px">`;
    $('upiLine').textContent = `Type the amount ${rupees(p.amount)} in your UPI app.`;
  } else {
    $('howTo').textContent = 'This shop has not set up UPI yet. Please pay at pickup or on delivery.';
    $('utr').closest('div').querySelectorAll('label,input,button').forEach((el) => el.classList.add('hidden'));
  }
}

async function claim() {
  $('payBtn').disabled = true;
  try {
    await api(`/api/payments/${encodeURIComponent(pid)}/claim`, { body: { utr: $('utr').value.trim() } });
    await load();
    setTimeout(() => { location.href = $('back').href; }, 1800);
  } finally { $('payBtn').disabled = false; }
}

load();
</script>
</body>
</html>
